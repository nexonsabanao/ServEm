name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (types, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servem_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servem_web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile (analyze, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servem_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  audit:
    name: Production audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/production-audit.mjs

  rules:
    name: Firestore rules compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global firebase-tools
      # emulators:exec compiles both rulesets against a throwaway project id;
      # an invalid rule fails the job before anything is deployed.
      - run: cd servem_web && firebase emulators:exec --only firestore,storage --project demo-servem "echo rules-compiled"
